name: Supabase keepalive

on:
  schedule:
    # Supabase Free projects pause after a week without database activity.
    # The Worker's Cron Triggers query the database daily; this is a second
    # signal that also fails loudly if the site or database is down.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nudge:
    name: Query the database through the live site
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check configuration
        shell: bash
        run: test -n "$CRON_SECRET"

      - name: Run the authenticated health check
        shell: bash
        run: |
          body=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 30 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://meriasmita.org/api/health")
          echo "$body" | grep -q '"db":"ok"' || { echo "Database check failed: $body"; exit 1; }
