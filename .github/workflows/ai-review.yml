name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    name: Claude security & logic review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: "true"
          prompt: |
            You are reviewing a pull request for Asmita, a safety-critical
            NCII (non-consensual intimate imagery) takedown platform. Review
            the PR diff (use `gh pr diff ${{ github.event.pull_request.number }}`)
            and the surrounding code as needed.

            FOCUS ON (in priority order):
            1. Safety invariants of this codebase: any code path that could
               fetch, store, render, or log submitted URLs/media; Aadhaar
               storage; bypass of ENABLE_HASH_UPLOAD / ENABLE_PLATFORM_API
               gates; unverified notice recipients; PII in notice bodies,
               logs, or tests.
            2. Security: SQL injection, authz bypass (IDOR, missing
               requireAdminPermission), CSRF gaps, secrets in code, broken
               encryption usage, rate-limit bypass.
            3. Business-logic correctness: case lifecycle state errors,
               idempotency breaks in notice/hash dispatch, escalation timer
               bugs, unhandled edge cases.
            4. Data integrity: audit-chain breaks, N+1 queries, missing
               transactions where multi-row writes must be atomic, anything
               touching auth, account deletion, or outbound email dispatch.

            IGNORE: style preferences, formatting, naming, comment density,
            test coverage gaps in untouched code. Do not comment on anything
            a linter would catch.

            Classify each finding as "CRITICAL:" (must fix before merge:
            exploitable, breaks a safety invariant, or corrupts data) or
            "WARNING:" (informational, author's call).

            Post ONLY CRITICAL findings as inline comments on the PR at the
            relevant line, using:
              gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments \
                -f body="CRITICAL: ..." -f commit_id="${{ github.event.pull_request.head.sha }}" \
                -f path="..." -F line=N -f side=RIGHT
            Inline comments become review conversations that block merging
            until resolved, so never post a WARNING inline.

            Finally post ONE summary comment on the PR
            (gh pr comment ${{ github.event.pull_request.number }} --body "...").
            List every CRITICAL finding, then every WARNING under a
            "Non-blocking warnings" heading, each with its file and line.
            Your very last output line must be exactly one of:
              Verdict: **PASS**   (no critical issues)
              Verdict: **BLOCK**  (one or more CRITICAL issues)
          claude_args: '--allowed-tools "Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(echo:*),Bash(cat:*),Read,Grep,Glob"'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fails closed: a review that crashed, was skipped or left no readable
      # verdict must not count as a pass. Only a CRITICAL finding (Verdict:
      # BLOCK) is a merge-blocking finding; warnings never are.
      - name: Enforce severity threshold
        run: |
          out=/home/runner/work/_temp/claude-execution-output.json
          if [ ! -s "$out" ]; then
            echo "::error::AI review output is missing or empty ($out). The review did not complete, so the gate fails. Re-run the job."
            exit 1
          fi
          if ! jq -e 'type == "array" and any(.[]; .type == "result")' "$out" >/dev/null 2>&1; then
            echo "::error::AI review output is unparseable or has no result entry. The gate fails. Re-run the job."
            exit 1
          fi
          if [ "$(jq -r '[.[] | select(.type == "result")] | last | .is_error // false' "$out")" = "true" ]; then
            echo "::error::AI review ended with an error result. The gate fails. Re-run the job."
            exit 1
          fi
          result=$(jq -r '[.[] | select(.type == "result")] | last | .result // ""' "$out")
          if printf '%s' "$result" | grep -q 'Verdict:.*BLOCK'; then
            echo "::error::AI review verdict is BLOCK. Merge blocked."
            exit 1
          fi
          if printf '%s' "$result" | grep -q 'Verdict:.*PASS'; then
            echo "AI review verdict: PASS"
            exit 0
          fi
          echo "::error::AI review output has no 'Verdict: PASS' or 'Verdict: BLOCK' line. The gate fails. Re-run the job."
          exit 1
